
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuckySpin – Glücksrad</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #101020, #24244b);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 95%;
  max-width: 550px;
  padding: 25px 10px;
}

h1 {
  color: #ffd700;
  font-size: 38px;
  text-shadow: 0 0 20px #ffae00;
}

.subtitle {
  color: #ccc;
  margin-bottom: 35px;
}

.wheel-container {
  position: relative;
  width: min(85vw, 430px);
  height: min(85vw, 430px);
  margin: 20px auto;
}

#wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 9px solid #ffd700;
  box-shadow: 0 0 30px #ffb70088;
  transition: transform 5s cubic-bezier(.12,.75,.15,1);
}

.pointer {
  position: absolute;
  top: -17px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  width: 0;
  height: 0;
  border-left: 22px solid transparent;
  border-right: 22px solid transparent;
  border-top: 48px solid white;
  filter: drop-shadow(0 3px 4px black);
}

.center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 75px;
  height: 75px;
  border-radius: 50%;
  background: #ffd700;
  border: 6px solid white;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #222;
  font-weight: bold;
  z-index: 3;
  box-shadow: 0 0 15px black;
}

button {
  background: linear-gradient(135deg, #ffd700, #ff9900);
  border: none;
  padding: 17px 45px;
  border-radius: 50px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  color: #222;
  box-shadow: 0 5px 20px #ffae0055;
  margin-top: 20px;
}

button:hover {
  transform: scale(1.05);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#result {
  font-size: 25px;
  font-weight: bold;
  color: #ffd700;
  min-height: 65px;
  margin-top: 25px;
}

.chances {
  color: #ccc;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎡 LuckySpin</h1>
<p class="subtitle">Dreh das Rad und teste dein Glück!</p>

<div class="wheel-container">

<div class="pointer"></div>

<canvas id="wheel" width="600" height="600"></canvas>

<div class="center">LUCKY</div>

</div>

<button id="spinButton" onclick="spin()">
🎯 JETZT DREHEN
</button>

<div id="result">Viel Glück!</div>

<p class="chances">
10 Felder · Jedes Feld hat 10 % Gewinnchance
</p>

</div>

<script>

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const colors = [
  "#ff3838",
  "#ff8c00",
  "#ffd700",
  "#36c95a",
  "#00bcd4",
  "#3478f6",
  "#9b59b6",
  "#ed4c9b",
  "#795548",
  "#607d8b"
];

const fields = [
  "Feld 1",
  "Feld 2",
  "Feld 3",
  "Feld 4",
  "Feld 5",
  "Feld 6",
  "Feld 7",
  "Feld 8",
  "Feld 9",
  "Feld 10"
];

const count = 10;
const angle = Math.PI * 2 / count;

function drawWheel() {

  for (let i = 0; i < count; i++) {

    const start = -Math.PI / 2 + i * angle;
    const end = start + angle;

    ctx.beginPath();
    ctx.moveTo(300, 300);
    ctx.arc(300, 300, 290, start, end);
    ctx.closePath();

    ctx.fillStyle = colors[i];
    ctx.fill();

    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.save();

    ctx.translate(300, 300);
    ctx.rotate(start + angle / 2);

    ctx.fillStyle = "white";
    ctx.font = "bold 27px Arial";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";

    ctx.fillText(fields[i], 265, 0);

    ctx.restore();
  }
}

drawWheel();

let rotation = 0;
let spinning = false;

function randomField() {

  const max = Math.floor(4294967296 / 10) * 10;
  const array = new Uint32Array(1);

  do {
    crypto.getRandomValues(array);
  } while (array[0] >= max);

  return array[0] % 10;
}

function spin() {

  if (spinning) return;

  spinning = true;

  document.getElementById("spinButton").disabled = true;
  document.getElementById("result").textContent = "🎡 Das Rad dreht sich...";

  const winner = randomField();

  // Ziel: Mitte des ausgewählten Feldes unter dem Zeiger
  const target = (360 - (winner * 36 + 18)) % 360;

  const current = rotation % 360;
  const extra = (target - current + 360) % 360;

  rotation += 360 * 7 + extra;

  canvas.style.transform = `rotate(${rotation}deg)`;

  setTimeout(() => {

    document.getElementById("result").textContent =
      "🎉 GEWONNEN: " + fields[winner] + "!";

    document.getElementById("spinButton").disabled = false;
    spinning = false;

  }, 5100);
}

</script>

</body>
</html>
